name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Check that the tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $expected"
            exit 1
          fi

      - name: Publish the offline HTML
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="manual-switching-${GITHUB_REF_NAME}.html"
          cp dist/index.html "$asset"
          gh release create "$GITHUB_REF_NAME" "$asset" --title "Manual de Switching ${GITHUB_REF_NAME}" --generate-notes
