# Builds the three parts of the web and publishes them together on GitHub Pages:
#   /            site/   (Hugo: lessons, scenarios, glossary, tools, "Qué es esto")
#   /app/        app/    (map and "Mi infraestructura")
#   /app/guias/  guias/  (switching guides, a single index.html)
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.169.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install Hugo (checksum verified)
        run: |
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          file="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSLO "${base}/${file}"
          curl -fsSLO "${base}/hugo_${HUGO_VERSION}_checksums.txt"
          grep " ${file}\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${file}" hugo
          sudo mv hugo /usr/local/bin/hugo
          hugo version

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: App
        working-directory: app
        run: |
          npm ci
          npx vitest run
          npm run build

      - name: Switching guides
        working-directory: guias
        env:
          # From /app/guias/ back to the site home; enables the "Volver a la web" link.
          VITE_HOME_URL: ../../
        run: |
          npm ci
          npm test
          npm run build

      - name: Tool downloads (copied from toolkit/ with their SHA-256)
        run: |
          node --test "site/scripts/*.test.mjs"
          node site/scripts/descargas.mjs

      - name: Site
        working-directory: site
        env:
          HUGO_PARAMS_APPURL: ${{ steps.pages.outputs.base_url }}/app/
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Assemble
        run: |
          mkdir -p _site/app/guias
          cp -r site/public/. _site/
          cp -r app/dist/. _site/app/
          cp guias/dist/index.html _site/app/guias/index.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
