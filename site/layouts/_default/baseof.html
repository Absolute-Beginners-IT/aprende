<!doctype html>
<html lang="{{ site.Language.Locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ "/" | relURL }}">{{ site.Title }}</a>
    <nav>
      <a href="{{ "lecciones/" | relURL }}">Lecciones</a>
      <a href="{{ "escenarios/" | relURL }}">Escenarios</a>
      <a href="{{ "glosario/" | relURL }}">Glosario</a>
      <a class="cta" href="{{ site.Params.appURL }}">Abrir el mapa</a>
    </nav>
  </header>
  <main class="page">{{ block "main" . }}{{ end }}</main>
  <footer class="foot"><p>Contenido de práctica: usa los scripts del toolkit solo en redes de tu empresa y con autorización.</p></footer>
</body>
</html>
