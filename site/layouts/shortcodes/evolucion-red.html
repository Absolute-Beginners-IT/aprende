{{- /* The office network growing stage by stage: {{< evolucion-red >}}. Stages come from data/visuales/evolucion-red.json.
  Without JavaScript the finished network and every stage's reason are shown; js/visuales.js turns them into tabs. */ -}}
{{- $d := index hugo.Data.visuales "evolucion-red" -}}
<figure class="viz viz-evolucion">
  <div class="viz__pestanas" role="tablist" aria-label="Etapas de la red" hidden>
    {{- range $i, $e := $d.etapas }}
    <button type="button" class="viz__boton" role="tab" data-etapa="{{ $i }}" aria-selected="{{ if eq $i 0 }}true{{ else }}false{{ end }}">{{ add $i 1 }}. {{ $e.titulo }}</button>
    {{- end }}
  </div>
  <div class="viz__lienzo">
    <svg viewBox="0 0 900 290" role="img" aria-labelledby="viz-evolucion-desc">
      <desc id="viz-evolucion-desc">Una red de oficina que crece por etapas: un ordenador, dos ordenadores unidos por un switch, un router hacia internet y un servidor con DHCP y DNS.</desc>
      <g data-elemento="switch">
        <path class="viz__cable viz__cable--fijo" d="M180 196 C 180 150, 380 150, 410 136"/>
        <path class="viz__cable viz__cable--fijo" d="M400 196 L 430 136"/>
        <rect class="viz__tarjeta" x="390" y="96" width="100" height="40" rx="12"/>
        <g class="viz__icono" transform="translate(440 116)"><path d="M-30 0 h6 M-17 0 h6 M-4 0 h6 M9 0 h6 M22 0 h6"/></g>
        <text class="viz__nombre" x="505" y="122">Switch</text>
      </g>
      <g data-elemento="router">
        <path class="viz__cable viz__cable--fijo" d="M440 96 L 440 66"/>
        <circle class="viz__tarjeta" cx="440" cy="42" r="24"/>
        <g class="viz__icono" transform="translate(440 42)"><path d="M-10 -4 h18 l-4 -4 M10 4 h-18 l4 4"/></g>
        <path class="viz__cable viz__cable--fijo" d="M464 42 L 640 42"/>
        <text class="viz__nombre" x="404" y="47" text-anchor="end">Router</text>
        <rect class="viz__tarjeta" x="640" y="20" width="120" height="44" rx="22"/>
        <text class="viz__nombre" x="700" y="47" text-anchor="middle">Internet</text>
      </g>
      <g data-elemento="servidor">
        <path class="viz__cable viz__cable--fijo" d="M470 136 C 500 160, 640 160, 660 196"/>
        <rect class="viz__tarjeta" x="610" y="196" width="100" height="62" rx="14"/>
        <g class="viz__icono" transform="translate(660 216)"><rect x="-20" y="-10" width="40" height="9" rx="3"/><rect x="-20" y="3" width="40" height="9" rx="3"/></g>
        <text class="viz__nombre" x="660" y="278" text-anchor="middle">DHCP y DNS</text>
      </g>
      <rect class="viz__tarjeta" x="140" y="196" width="80" height="62" rx="14"/>
      <g class="viz__icono" transform="translate(180 222)"><rect x="-18" y="-14" width="36" height="24" rx="3"/><path d="M-24 18 h48"/></g>
      <text class="viz__nombre" x="180" y="278" text-anchor="middle">Oficina 1</text>
      <g data-elemento="oficina2">
        <rect class="viz__tarjeta" x="360" y="196" width="80" height="62" rx="14"/>
        <g class="viz__icono" transform="translate(400 222)"><rect x="-18" y="-14" width="36" height="24" rx="3"/><path d="M-24 18 h48"/></g>
        <text class="viz__nombre" x="400" y="278" text-anchor="middle">Oficina 2</text>
      </g>
    </svg>
  </div>
  <ol class="viz__etapas">
    {{- range $i, $e := $d.etapas }}
    <li class="viz__etapa" data-muestra="{{ delimit $e.muestra " " }}"><b>{{ $e.titulo }}</b> <span>{{ $e.porque }}</span></li>
    {{- end }}
  </ol>
  <figcaption>Cada etapa resuelve el problema de la anterior: por eso se montan en este orden.</figcaption>
</figure>
