platform: synology-dsm
task: config-backup
summary: >-
  Exporta la configuración de un NAS Synology a un archivo .dss desde Control Panel,
  Update & Restore, Configuration Backup, y la guarda fuera del NAS.
risk:
  level: low
  reason: Exportar la configuración no cambia nada en el NAS.
params: []
preflight:
  - text: >-
      El archivo contiene la configuración de usuarios, carpetas y servicios. Ten decidido
      dónde guardarlo fuera del NAS.
  - text: >-
      Recuerda que el .dss no lleva los datos de las carpetas compartidas: esos se copian
      con Hyper Backup.
steps:
  - title: Exportar la configuración
    figure:
      id: synology-dsm/copia-configuracion
      alt: >-
        Pantalla simplificada de Control Panel con la sección Update & Restore abierta en la pestaña
        Configuration Backup: el botón Export en Manual Export, la opción Self-defined en Automatic Backup y
        el botón Restore en Restore DSM Configurations.
      caption: >-
        Pantalla redibujada y simplificada a partir de la guía de Synology DSM (no es una captura). 1 La
        pestaña Configuration Backup de Update & Restore. 2 Export, en Manual Export, descarga el archivo
        .dss a tu ordenador. 3 En Automatic Backup, si activas la copia en tu cuenta Synology, elige el
        cifrado Self-defined. Las barras grises son elementos que la guía no nombra.
    manual: true
    explanation: >-
      Ve a Control Panel, Update & Restore, pestaña Configuration Backup. En Manual Export
      pulsa Export: se descarga a tu ordenador un archivo con el nombre del modelo y la
      fecha, con extensión .dss.
  - title: Guardar la copia en su sitio
    figure:
      id: synology-dsm/esquema-copia-configuracion
      alt: >-
        Esquema: la configuración sale del NAS con Export, llega a tu ordenador como archivo .dss y se mueve
        al repositorio de copias de la empresa; aparte, la copia opcional en la cuenta Synology y los datos
        de las carpetas compartidas, que se copian con Hyper Backup.
      caption: >-
        Esquema. 1 Desde el NAS exportas la configuración con Export. 2 El archivo .dss llega a tu
        ordenador, con el nombre del modelo y la fecha. 3 Lo mueves al repositorio de copias de la empresa,
        fuera del NAS. 4 La copia automática en la cuenta Synology es opcional: guarda una versión por NAS y
        se borra si no se sube nada en 180 días. 5 Los datos de las carpetas compartidas no van en el .dss:
        se copian con Hyper Backup.
    manual: true
    explanation: >-
      Mueve el archivo .dss al repositorio de copias de la empresa. Una copia que solo está
      en tu ordenador se pierde con él.
  - title: Valorar la copia automática
    manual: true
    explanation: >-
      En Automatic Backup puedes activar la copia automática en tu cuenta Synology. Solo
      guarda una versión por NAS y se borra si no se sube nada en 180 días; si la usas,
      elige el cifrado definido por ti (Self-defined).
verification:
  - expect: El archivo .dss está en el repositorio de copias, con la fecha de hoy y un tamaño mayor que cero.
rollback:
  summary: >-
    No hay nada que deshacer en el NAS. Si el archivo no hace falta, se borra del
    ordenador.
  steps:
    - title: Borrar el archivo
      manual: true
      explanation: Borra el archivo .dss descargado. No toca el NAS.
sources:
  - title: DSM 7 — Configuration Backup
    url: https://kb.synology.com/en-global/DSM/help/DSM/AdminCenter/system_configbackup?version=7
status:
  level: docs-checked
  reviewed: '2026-11-06'
  firmware: DSM 7.4
  notes: >-
    Manual Export con el botón Export, el nombre del archivo, el formato .dss, la copia
    automática en la cuenta Synology (una versión, borrada a los 180 días, cifrado
    Self-defined recomendado) y lo que incluye están contrastados con la ayuda de DSM 7. La
    ruta Update & Restore, Configuration Backup no aparece literal en la página. Falta
    probarla en un NAS real.
