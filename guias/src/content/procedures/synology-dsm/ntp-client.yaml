platform: synology-dsm
task: ntp-client
summary: >-
  Sincroniza la hora de un NAS Synology con el servidor de tiempo de la empresa desde
  Control Panel, Regional Options, Time.
risk:
  level: low
  reason: Sincronizar la hora no afecta a los datos ni al acceso de gestión.
params:
  - id: ntpServer
    label: Servidor de tiempo
    type: text
    example: 192.168.10.5
    pattern: '^[A-Za-z0-9.-]{1,253}$'
    patternHint: Una IP o un nombre de equipo, sin espacios.
    help: Si usas un nombre, el NAS necesita un DNS válido en Control Panel, Network.
preflight:
  - text: Comprueba en Control Panel, Network, que el NAS tiene un servidor DNS válido si vas a usar un nombre.
steps:
  - title: Abrir la configuración de la hora
    manual: true
    explanation: Ve a Control Panel, Regional Options, pestaña Time.
  - title: Elegir el servidor de tiempo
    figure:
      id: synology-dsm/hora-ntp
      alt: >-
        Pantalla simplificada de Control Panel con la sección Regional Options abierta en la pestaña Time:
        la lista Time zone, la opción Synchronize with NTP server marcada con el servidor 192.168.10.5, el
        botón Update Now y el botón Apply.
      caption: >-
        Pantalla redibujada y simplificada a partir de la guía de Synology DSM (no es una captura). 1 La
        pestaña Time de Regional Options. 2 La zona horaria (Time zone). 3 Synchronize with NTP server, con
        el servidor de ejemplo 192.168.10.5. 4 Update Now comprueba que el NAS sincroniza. 5 Apply guarda el
        cambio. Las barras grises son elementos que la guía no nombra.
    manual: true
    explanation: >-
      Revisa la zona horaria (Time zone). En Time Setting elige Synchronize with NTP server
      y escribe {{ntpServer}}.
  - title: Comprobar y aplicar
    manual: true
    explanation: >-
      Pulsa Update Now para comprobar que el NAS sincroniza con {{ntpServer}} y después
      Apply.
verification:
  - expect: Update Now termina sin error y la hora del NAS coincide con la de la red.
rollback:
  summary: Vuelve al servidor de tiempo que tenía.
  steps:
    - title: Cambiar el servidor de tiempo
      manual: true
      explanation: >-
        En Control Panel, Regional Options, Time, escribe el servidor anterior o elige uno de
        la lista, y pulsa Apply.
  lockoutRecovery: Este cambio no afecta al acceso de gestión.
sources:
  - title: DSM 7 — Time
    url: https://kb.synology.com/en-global/DSM/help/DSM/AdminCenter/system_time?version=7
status:
  level: docs-checked
  reviewed: '2026-11-06'
  firmware: DSM 7.4
  notes: >-
    La ruta Control Panel, Regional Options, Time, la opción Synchronize with NTP server, el
    botón Update Now y la necesidad de un DNS válido están contrastados con la ayuda de
    DSM 7. Falta probarla en un NAS real.
