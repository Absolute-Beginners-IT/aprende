    url: https://community.fortinet.com/t5/FortiGate/Technical-Tip-Different-options-to-trigger-an-HA-failover-FGCP/ta-p/274081
  - title: Fortinet Community — FortiGate HA failover due to memory utilization
    url: https://community.fortinet.com/fortigate-3/technical-tip-fortigate-ha-failover-due-to-memory-utilization-96957
  - title: Fortinet Community — How conserve mode is triggered
    url: https://community.fortinet.com/fortigate-3/technical-tip-how-conserve-mode-is-triggered-99971
