platform: fortinet-fortigate
task: memory-recovery
summary: >-
  Qué hacer cuando el FortiGate principal de un clúster se queda sin memoria y el
  de reserva no toma el relevo: confirmarlo, guardar las pruebas, pasar el servicio
  al firewall sano y recuperar el saturado.
risk:
  level: high
  reason: >-
    Se trabaja con la empresa ya afectada, y pasar el servicio de un firewall a otro
    o reiniciar un proceso corta el tráfico unos segundos.
branching: true
params:
  - id: adminUser
    label: Tu usuario de administrador
    type: text
    example: admin
    help: El mismo con el que entras por SSH. Sirve para saltar de un firewall al otro.
  - id: reserveIndex
    label: Número del firewall de reserva en el clúster
    type: number
    example: '1'
    min: 0
    max: 15
    help: >-
      Sale en get system ha status: es el HA cluster index de la línea que empieza
      por Secondary.
  - id: saturatedIndex
    label: Número del firewall saturado en el clúster
    type: number
    example: '0'
    min: 0
    max: 15
    help: >-
      Sale en get system ha status: es el HA cluster index de la línea que empieza
      por Primary, antes de pasar el servicio.
  - id: lowPriority
    label: Prioridad nueva del firewall saturado
    type: number
    example: '50'
    min: 0
    max: 255
    required: false
    help: >-
      Solo si override está en enable. Tiene que ser menor que la prioridad del
      firewall de reserva.
  - id: originalPriority
    label: Prioridad que tenía el firewall saturado
    type: number
    example: '200'
    min: 0
    max: 255
    required: false
    help: Solo si override está en enable. Es la que viste en el paso «Ver cómo está montado el clúster».
  - id: processId
    label: Número (PID) del proceso que llena la memoria
    type: number
    example: '1234'
    min: 1
    required: false
    help: >-
      Solo si el firewall de reserva no está sano. Es la primera columna numérica de
      diagnose sys top-mem.
preflight:
  - text: >-
      Antes de conectar, activa el registro de la sesión para que todo lo que hagas
      quede guardado en un archivo: es la prueba que pedirá el proveedor. En PuTTY:
      1) escribe la IP de gestión del firewall en Host Name; 2) en el menú de la
      izquierda, entra en Session › Logging; 3) marca All session output; 4) en Log
      file name pulsa Browse, elige una carpeta y llama al archivo
      firewall-&Y&M&D-&T.log, para que cada conexión tenga su archivo con la fecha y
      la hora; 5) pulsa Open e inicia sesión. Si usas otro programa, busca su opción
      de registro (log) antes de conectar.
  - text: >-
      Ya conectado, mira si el firewall usa VDOM (dominios virtuales: varios
      firewalls lógicos dentro del mismo equipo). Busca la línea Virtual domain
      configuration. Si pone disable, no hay VDOM y no tienes que hacer nada más. Si
      pone multiple, escribe config global y pulsa Intro antes de seguir: los
      comandos de esta guía son del equipo entero y solo funcionan ahí. Si se corta
      la sesión y vuelves a entrar, escríbelo otra vez.
    command: get system status
  - text: >-
      Apunta la hora a la que empezó el problema y qué notan los usuarios, por
      ejemplo: «no carga ninguna web nueva, pero las videollamadas siguen».
  - text: Avisa a los usuarios de que hay una incidencia y al proveedor de que la estás atendiendo.
  - text: Si SSH no responde, usa el botón CLI de la interfaz web o el cable de consola.
steps:
  - title: Confirmar que es la memoria
    figure:
      id: fortinet-fortigate/esquema-modo-conservacion
      alt: >-
        Esquema: con la memoria usada por encima del 88 % el firewall principal entra en
        modo de conservación, por encima del 95 % rechaza las conexiones nuevas y sale del
        modo al bajar del 82 %. Como sigue respondiendo al firewall de reserva, este no toma
        el servicio, salvo que se haya configurado memory-based-failover.
      caption: >-
        Esquema. 1 Por encima del 88 % de memoria usada, el firewall entra en modo de
        conservación. 2 Por encima del 95 %, rechaza las conexiones nuevas. 3 Sale del modo
        al bajar del 82 %. 4 El firewall saturado sigue respondiendo al de reserva, así que
        este no toma el servicio. 5 Solo cambiaría solo si se hubiera configurado
        memory-based-failover, que de fábrica está desactivado.
    commands:
      - get system performance status
    explanation: >-
      Busca la línea Memory. Si la memoria usada pasa del 88 %, el firewall se está
      protegiendo y rechaza conexiones nuevas: es este problema, sigue la guía. Si
      está por debajo, la causa es otra y esta guía no te sirve.
    breakdown:
      - token: get system performance status
        meaning: Resumen de CPU, memoria y sesiones. Solo lee, no cambia nada.
  - title: Guardar las pruebas del fallo
    commands:
      - diagnose sys top-mem 10
      - diagnose debug crashlog read
      - get system status
    explanation: >-
      Tres consultas que solo leen. La primera dice qué proceso se está comiendo la
      memoria. La segunda, desde cuándo entra y sale el firewall del modo de
      conservación. La tercera, el modelo y la versión de FortiOS. Todo queda en el
      registro de tu sesión SSH.
    warning: >-
      Hazlo antes de reiniciar nada. La lista de procesos se pierde al reiniciar; el
      registro de fallos sí se conserva.
    breakdown:
      - token: diagnose sys top-mem 10
        meaning: Los 10 procesos que más memoria usan, de más a menos. Apunta el nombre y el número del primero.
      - token: diagnose debug crashlog read
        meaning: Historial de fallos del firewall, con cada entrada y salida del modo de conservación.
      - token: get system status
        meaning: Modelo, número de serie y versión de FortiOS.
  - title: Ver cómo está montado el clúster
    commands:
      - get system ha status
      - get system ha | grep override
      - get system ha | grep priority
    explanation: >-
      En la primera salida, la línea Primary es el firewall que da servicio, el
      saturado, y la línea Secondary es el de reserva. Apunta el HA cluster index de
      cada uno en «Tus datos». Las otras dos líneas dicen si override está en enable
      o en disable y qué prioridad tiene este firewall. De override depende cómo se
      pasa el servicio al de reserva.
    breakdown:
      - token: get system ha status
        meaning: Qué firewall da servicio, cuál espera y si están sincronizados. Solo lee.
      - token: get system ha | grep override
        meaning: >-
          Muestra solo la línea override. En enable, da servicio siempre el firewall
          con más prioridad. En disable, el que lleva más tiempo encendido.
      - token: get system ha | grep priority
        meaning: La prioridad de este firewall, de 0 a 255.
  - title: Entrar en el firewall de reserva
    commands:
      - execute ha manage {{reserveIndex}} {{adminUser}}
    explanation: >-
      Saltas desde el firewall principal al de reserva sin abrir otra conexión. Te
      pedirá la contraseña de {{adminUser}}. A partir de aquí, lo que escribas se
      ejecuta en el de reserva.
  - title: Comprobar que el de reserva está sano y volver
    commands:
      - get system performance status
      - get system ha | grep priority
      - exit
    explanation: >-
      Mira su línea Memory y apunta su prioridad; exit te devuelve al firewall
      principal. Si su memoria está por debajo del 80 %, está sano: pasa el servicio
      con el paso que corresponda a tu override. Si también está alta o no responde,
      salta a «Si el de reserva no está sano».
  - title: 'Si override está en enable: pasar el servicio al de reserva'
    commands:
      - config system ha
      - set priority {{lowPriority}}
      - end
    explanation: >-
      Con override en enable manda la prioridad. Bajas la del firewall saturado a
      {{lowPriority}}, por debajo de la del de reserva, y el clúster cambia de
      principal. Apunta la prioridad que tenía en «Tus datos» para poder devolverla.
    warning: >-
      Corta el tráfico unos segundos y tu sesión SSH se cerrará: vuelve a conectar a
      la misma IP. Ahora estarás en el otro firewall.
    breakdown:
      - token: set priority {{lowPriority}}
        meaning: Prioridad del firewall en el clúster. Con override en enable, da servicio el que la tiene más alta.
  - title: 'Si override está en disable: pasar el servicio al de reserva'
    commands:
      - diagnose sys ha reset-uptime
    explanation: >-
      Con override en disable da servicio el firewall que lleva más tiempo en el
      clúster. Este comando pone a cero ese tiempo en el firewall saturado, así que
      el clúster elige al de reserva. No reinicia nada.
    warning: >-
      Corta el tráfico unos segundos y tu sesión SSH se cerrará: vuelve a conectar a
      la misma IP. Ahora estarás en el otro firewall.
  - title: Comprobar que el servicio ha vuelto
    commands:
      - get system ha status
      - get system performance status
    explanation: >-
      El firewall que era de reserva aparece ahora como Primary y su memoria está
      baja. Pide a un par de usuarios que abran una web nueva. Si funciona, la
      empresa ya tiene servicio y puedes recuperar el firewall saturado con calma.
  - title: Entrar en el firewall saturado
    commands:
      - execute ha manage {{saturatedIndex}} {{adminUser}}
    explanation: >-
      Ahora el saturado es el de reserva y no da servicio, así que puedes reiniciarlo
      sin cortar a nadie. Entra en él igual que antes; te pedirá la contraseña.
  - title: Reiniciar el firewall saturado
    commands:
      - execute reboot
    explanation: >-
      Responde y para confirmar. Al arrancar tendrá la memoria limpia y volverá al
      clúster como reserva, porque tiene menos prioridad o menos tiempo encendido.
      Tarda unos minutos; compruébalo después con get system ha status.
    warning: >-
      Mientras reinicia no hay firewall de reserva: si el principal fallara ahora, la
      empresa se quedaría sin red. No devuelvas la prioridad anterior hasta que el
      proveedor haya corregido la causa.
  - title: 'Si el de reserva no está sano: reiniciar el proceso que llena la memoria'
    commands:
      - diagnose sys kill 11 {{processId}}
    explanation: >-
      Solo si no has podido pasar el servicio. Usa el número del primer proceso de
      diagnose sys top-mem. FortiOS lo vuelve a arrancar solo y la memoria debería
      bajar en un par de minutos; compruébalo con get system performance status.
    warning: >-
      Solo si el proceso es ipsengine, wad o node; si es otro, no lo toques y llama
      al proveedor. Reiniciarlo corta un momento la inspección del tráfico. Si la
      memoria no baja, el último recurso es reiniciar el firewall con execute reboot,
      que deja a la empresa sin red unos minutos: pide permiso antes.
    breakdown:
      - token: diagnose sys kill 11 {{processId}}
        meaning: Cierra el proceso {{processId}} y deja constancia en el registro de fallos. FortiOS lo vuelve a arrancar.
  - title: Registrar lo ocurrido y avisar al proveedor
    manual: true
    explanation: >-
      Cierra el registro de la sesión SSH y envía el archivo al proveedor con un
      resumen: hora de inicio, qué notaban los usuarios, el proceso que más memoria
      usaba, qué has hecho y a qué hora, y cuándo volvió el servicio. Pídele la causa
      y si es un fallo conocido de la versión: mientras no se corrija, puede
      repetirse.
verification:
  - command: get system ha status
    expect: >-
      El firewall sano aparece como Primary, el otro como Secondary y los dos están
      sincronizados.
  - command: get system performance status
    expect: La memoria usada del firewall que da servicio está por debajo del 82 %.
  - expect: Los usuarios vuelven a abrir webs y conexiones nuevas.
rollback:
  summary: >-
    El servicio vuelve al firewall original cuando el proveedor haya corregido la
    causa, en una ventana de mantenimiento y avisando, porque hay un corte de unos
    segundos.
  steps:
    - title: 'Con override en enable: devolver la prioridad'
      commands:
        - config system ha
        - set priority {{originalPriority}}
        - end
      explanation: >-
        Se escribe en el firewall original, entrando en él con execute ha manage. Al
        recuperar su prioridad vuelve a dar servicio.
    - title: 'Con override en disable: reiniciar el tiempo del principal actual'
      commands:
        - diagnose sys ha reset-uptime
      explanation: Se escribe en el firewall que da servicio ahora, para que el clúster elija al otro.
  lockoutRecovery: >-
    Si SSH no responde, usa el botón CLI de la interfaz web o el cable de consola. Al
    cambiar de firewall principal tu sesión SSH se corta: vuelve a conectar a la
    misma IP, con el registro activado como al principio, y con VDOM escribe otra vez
    config global.
sources:
