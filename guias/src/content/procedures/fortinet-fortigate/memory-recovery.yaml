    url: https://community.fortinet.com/fortigate-3/technical-tip-actions-and-information-that-should-be-collected-when-a-fortigate-device-enters-in-conserve-mode-99932
  - title: Fortinet Community — Different options to trigger an HA failover (FGCP)
    url: https://community.fortinet.com/t5/FortiGate/Technical-Tip-Different-options-to-trigger-an-HA-failover-FGCP/ta-p/274081
  - title: Fortinet Community — How to access the secondary unit with execute ha manage
    url: https://community.fortinet.com/fortigate-3/technical-tip-how-to-access-the-secondary-unit-from-the-primary-with-the-execute-ha-manage-command-97867
  - title: Fortinet Community — Identifying the FortiGate reboot reasons
    url: https://community.fortinet.com/fortigate-3/technical-guide-identifying-the-fortigate-reboot-reasons-and-what-to-do-next-209310
  - title: Fortinet Community — How conserve mode is triggered
    url: https://community.fortinet.com/fortigate-3/technical-tip-how-conserve-mode-is-triggered-99971
  - title: Fortinet Community — FortiGate HA failover due to memory utilization
    url: https://community.fortinet.com/fortigate-3/technical-tip-fortigate-ha-failover-due-to-memory-utilization-96957
status:
  level: docs-checked
  reviewed: '2026-11-13'
  firmware: FortiOS 7.6
  notes: >-
    Contrastada con la documentación y los artículos de soporte de Fortinet para
    FortiOS 7.6; la ficha de la plataforma sigue en 7.4. Los umbrales del 82, 88 y
    95 % son los de fábrica. No se ha probado en un FortiGate real: la salida exacta
    de los comandos, el regreso con exit tras execute ha manage y el cambio de
    principal con set priority conviene confirmarlos con el soporte antes de
    necesitarlos.
