status:
  level: docs-checked
  reviewed: '2026-11-12'
  firmware: FortiOS 7.6
  notes: >-
    Contrastada con la documentación y los artículos de soporte de Fortinet para
    FortiOS 7.6; la ficha de la plataforma sigue en 7.4. Los umbrales del 82, 88 y
    95 % son los de fábrica. No se ha probado en un FortiGate real, y la salida exacta
    de los comandos no se ha contrastado. El comportamiento de set priority con
    override activado conviene confirmarlo con el soporte antes de usarlo.
