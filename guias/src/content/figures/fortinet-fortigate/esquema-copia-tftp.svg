<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" aria-hidden="true">
  <text class="fg-texto fg-negrita" x="20" y="30">Por qué la copia pasa por el servidor TFTP y dónde tiene que acabar</text>
  <rect class="fg-caja" x="20" y="70" width="230" height="110" rx="12"/>
  <text class="fg-texto fg-negrita" x="135.0" y="94" text-anchor="middle">FortiGate</text>
  <text class="fg-tenue fg-peque" x="135.0" y="116" text-anchor="middle">configuración completa</text>
  <text class="fg-tenue fg-peque" x="135.0" y="134" text-anchor="middle">con VDOM: antes config global</text>
  <text class="fg-tenue fg-peque" x="135.0" y="152" text-anchor="middle">execute backup config tftp</text>
  <path class="fg-flecha fg-flecha--datos" d="M250 125 H285 M276 119 L285 125 L276 131"/>
  <text class="fg-tenue fg-peque" x="267.5" y="114" text-anchor="middle">TFTP</text>
  <rect class="fg-caja" x="285" y="70" width="230" height="110" rx="12"/>
  <text class="fg-texto fg-negrita" x="400.0" y="94" text-anchor="middle">Servidor TFTP</text>
  <text class="fg-tenue fg-peque" x="400.0" y="116" text-anchor="middle">192.168.10.40</text>
  <text class="fg-tenue fg-peque" x="400.0" y="134" text-anchor="middle">fgt60f-antes-cambio.conf</text>
  <text class="fg-tenue fg-peque" x="400.0" y="152" text-anchor="middle">sin usuario ni contraseña</text>
  <path class="fg-flecha" d="M515 125 H550 M541 119 L550 125 L541 131"/>
  <text class="fg-tenue fg-peque" x="532.5" y="114" text-anchor="middle">mover</text>
  <rect class="fg-caja fg-caja--clave" x="550" y="70" width="230" height="110" rx="12"/>
  <text class="fg-texto fg-negrita" x="665.0" y="94" text-anchor="middle">Repositorio de copias</text>
  <text class="fg-tenue fg-peque" x="665.0" y="116" text-anchor="middle">de la empresa</text>
  <text class="fg-tenue fg-peque" x="665.0" y="134" text-anchor="middle">lugar definitivo de la copia</text>
  <circle class="fg-num" cx="20" cy="70" r="11"/>
  <text class="fg-num-t" x="20" y="74" text-anchor="middle">1</text>
  <circle class="fg-num" cx="285" cy="70" r="11"/>
  <text class="fg-num-t" x="285" y="74" text-anchor="middle">2</text>
  <circle class="fg-num" cx="550" cy="70" r="11"/>
  <text class="fg-num-t" x="550" y="74" text-anchor="middle">3</text>
  <rect class="fg-lateral" x="20" y="220" width="760" height="40" rx="10"/>
  <text class="fg-texto" x="44" y="245">Sin contraseña al final del comando, el archivo viaja y se guarda sin cifrar.</text>
  <circle class="fg-num" cx="20" cy="220" r="11"/>
  <text class="fg-num-t" x="20" y="224" text-anchor="middle">4</text>
</svg>
