<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" aria-hidden="true">
  <text class="fg-texto fg-negrita" x="20" y="30">Por qué el nodo saturado no cede el servicio al otro</text>
  <rect class="fg-caja fg-caja--clave" x="20" y="60" width="330" height="150" rx="12"/>
  <text class="fg-texto fg-negrita" x="185.0" y="86" text-anchor="middle">Memoria usada del nodo primario</text>
  <text class="fg-texto" x="60" y="120">88 %: entra en modo de conservación</text>
  <text class="fg-texto" x="60" y="148">95 %: descarta las sesiones nuevas</text>
  <text class="fg-tenue" x="60" y="176">82 %: sale del modo de conservación</text>
  <circle class="fg-num" cx="40" cy="116" r="11"/>
  <text class="fg-num-t" x="40" y="120" text-anchor="middle">1</text>
  <circle class="fg-num" cx="40" cy="144" r="11"/>
  <text class="fg-num-t" x="40" y="148" text-anchor="middle">2</text>
  <circle class="fg-num" cx="40" cy="172" r="11"/>
  <text class="fg-num-t" x="40" y="176" text-anchor="middle">3</text>
  <path class="fg-flecha" d="M350 105 H480 M471 99 L480 105 L471 111"/>
  <text class="fg-tenue fg-peque" x="415" y="94" text-anchor="middle">sigue respondiendo</text>
  <circle class="fg-num" cx="415" cy="128" r="11"/>
  <text class="fg-num-t" x="415" y="132" text-anchor="middle">4</text>
  <rect class="fg-caja fg-caja--clave" x="480" y="60" width="300" height="90" rx="12"/>
  <text class="fg-texto fg-negrita" x="630.0" y="84" text-anchor="middle">Nodo secundario</text>
  <text class="fg-tenue fg-peque" x="630.0" y="106" text-anchor="middle">sano y en espera</text>
  <text class="fg-tenue fg-peque" x="630.0" y="124" text-anchor="middle">no toma el servicio</text>
  <rect class="fg-lateral" x="20" y="238" width="760" height="40" rx="10"/>
  <text class="fg-texto" x="44" y="263">Solo conmuta por memoria con memory-based-failover activado; de fábrica no lo está.</text>
  <circle class="fg-num" cx="20" cy="238" r="11"/>
  <text class="fg-num-t" x="20" y="242" text-anchor="middle">5</text>
</svg>
