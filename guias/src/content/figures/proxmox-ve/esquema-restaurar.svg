  <text class="fg-num-t" x="276" y="64" text-anchor="middle">1</text>
  <circle class="fg-num" cx="536" cy="210" r="11"/>
  <text class="fg-num-t" x="536" y="214" text-anchor="middle">2</text>
  <circle class="fg-num" cx="580" cy="92" r="11"/>
  <text class="fg-num-t" x="580" y="96" text-anchor="middle">3</text>
