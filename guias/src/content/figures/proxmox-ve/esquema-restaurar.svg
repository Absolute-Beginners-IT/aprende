<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" aria-hidden="true">
  <text class="fg-texto fg-negrita" x="20" y="30">Restaurar sin pisar la configuración en uso</text>
  <rect class="fg-caja" x="16" y="120" width="200" height="74" rx="12"/>
  <text class="fg-texto fg-negrita" x="116.0" y="144" text-anchor="middle">Archivo de la copia</text>
  <text class="fg-tenue fg-peque" x="116.0" y="166" text-anchor="middle">pve1-antes-cambio.tar.gz</text>
  <text class="fg-tenue fg-peque" x="116.0" y="184" text-anchor="middle">en /root</text>
  <path class="fg-flecha fg-flecha--datos" d="M216 157 L276 157"/>
  <path class="fg-flecha fg-flecha--datos" d="M267.9 153.1 L276 157 L267.9 160.9"/>
  <text class="fg-tenue fg-peque" x="246" y="148" text-anchor="middle">tar -xzf</text>
  <rect class="fg-caja fg-caja--clave" x="276" y="60" width="230" height="270" rx="12"/>
  <text class="fg-texto fg-negrita" x="391.0" y="84" text-anchor="middle">/root/restaurar</text>
  <text class="fg-tenue fg-peque" x="391.0" y="106" text-anchor="middle">copia extraída aparte:</text>
  <text class="fg-tenue fg-peque" x="391.0" y="124" text-anchor="middle">etc/pve</text>
  <text class="fg-tenue fg-peque" x="391.0" y="142" text-anchor="middle">etc/network/interfaces</text>
  <text class="fg-tenue fg-peque" x="391.0" y="160" text-anchor="middle">etc/hosts y etc/hostname</text>
  <rect class="fg-lateral" x="566" y="60" width="218" height="270" rx="14"/>
  <text class="fg-tenue fg-peque" x="578" y="76">EN USO</text>
  <rect class="fg-caja" x="580" y="92" width="192" height="104" rx="12"/>
  <text class="fg-texto fg-negrita" x="676.0" y="116" text-anchor="middle">Máquina 101</text>
  <text class="fg-tenue fg-peque" x="676.0" y="138" text-anchor="middle">/etc/pve/qemu-server/</text>
  <text class="fg-tenue fg-peque" x="676.0" y="156" text-anchor="middle">101.conf</text>
  <text class="fg-tenue fg-peque" x="676.0" y="174" text-anchor="middle">con la máquina apagada</text>
  <rect class="fg-caja" x="580" y="212" width="192" height="104" rx="12"/>
  <text class="fg-texto fg-negrita" x="676.0" y="236" text-anchor="middle">Red del nodo</text>
  <text class="fg-tenue fg-peque" x="676.0" y="258" text-anchor="middle">/etc/network/interfaces</text>
  <text class="fg-tenue fg-peque" x="676.0" y="276" text-anchor="middle">y después ifreload -a</text>
  <text class="fg-tenue fg-peque" x="676.0" y="294" text-anchor="middle">desde la consola física</text>
  <path class="fg-flecha fg-flecha--datos" d="M506 144 L580 144"/>
  <path class="fg-flecha fg-flecha--datos" d="M571.9 140.1 L580 144 L571.9 147.9"/>
  <text class="fg-tenue fg-peque" x="536" y="136" text-anchor="middle">cp</text>
  <path class="fg-flecha" d="M506 190 L566 190" stroke-dasharray="5 4"/>
  <path class="fg-flecha" d="M557.9 186.1 L566 190 L557.9 193.9"/>
  <text class="fg-tenue fg-peque" x="536" y="182" text-anchor="middle">diff</text>
  <path class="fg-flecha fg-flecha--datos" d="M506 264 L580 264"/>
  <path class="fg-flecha fg-flecha--datos" d="M571.9 260.1 L580 264 L571.9 267.9"/>
  <text class="fg-tenue fg-peque" x="536" y="256" text-anchor="middle">cp</text>
  <text class="fg-tenue fg-peque" x="20" y="360">Los discos de las máquinas no vienen en esta copia: vuelven desde una copia de la máquina virtual.</text>
