<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" aria-hidden="true">
  <text class="fg-texto fg-negrita" x="20" y="30">Snapshot antes de un cambio: dos salidas</text>
  <rect class="fg-caja" x="16" y="120" width="220" height="104" rx="12"/>
  <text class="fg-texto fg-negrita" x="126.0" y="144" text-anchor="middle">qm snapshot</text>
  <text class="fg-tenue fg-peque" x="126.0" y="166" text-anchor="middle">guarda el estado de los discos</text>
  <text class="fg-tenue fg-peque" x="126.0" y="184" text-anchor="middle">con el nombre antes_actualizar</text>
  <text class="fg-tenue fg-peque" x="126.0" y="202" text-anchor="middle">--vmstate 1: también la memoria</text>
  <path class="fg-flecha" d="M236 172 L296 172"/>
  <path class="fg-flecha" d="M287.9 168.1 L296 172 L287.9 175.9"/>
  <rect class="fg-caja" x="296" y="120" width="180" height="104" rx="12"/>
  <text class="fg-texto fg-negrita" x="386.0" y="144" text-anchor="middle">Cambio</text>
  <text class="fg-tenue fg-peque" x="386.0" y="166" text-anchor="middle">actualización o</text>
  <text class="fg-tenue fg-peque" x="386.0" y="184" text-anchor="middle">configuración,</text>
  <text class="fg-tenue fg-peque" x="386.0" y="202" text-anchor="middle">y comprobarlo</text>
  <path class="fg-flecha" d="M476 150 L556 100"/>
  <path class="fg-flecha" d="M547.1 101.0 L556 100 L551.2 107.6"/>
  <rect class="fg-caja" x="556" y="50" width="228" height="104" rx="12"/>
  <text class="fg-texto fg-negrita" x="670.0" y="74" text-anchor="middle">Funciona: qm delsnapshot</text>
  <text class="fg-tenue fg-peque" x="670.0" y="96" text-anchor="middle">se queda el cambio; la</text>
  <text class="fg-tenue fg-peque" x="670.0" y="114" text-anchor="middle">snapshot ocupaba espacio y</text>
  <text class="fg-tenue fg-peque" x="670.0" y="132" text-anchor="middle">ralentizaba los discos</text>
  <path class="fg-flecha" d="M476 196 L556 250"/>
  <path class="fg-flecha" d="M551.5 242.2 L556 250 L547.1 248.7"/>
  <rect class="fg-caja fg-caja--clave" x="556" y="200" width="228" height="104" rx="12"/>
  <text class="fg-texto fg-negrita" x="670.0" y="224" text-anchor="middle">Sale mal: qm rollback</text>
  <text class="fg-tenue fg-peque" x="670.0" y="246" text-anchor="middle">vuelve al estado de la snapshot</text>
  <text class="fg-tenue fg-peque" x="670.0" y="264" text-anchor="middle">y se pierde lo cambiado después</text>
  <text class="fg-tenue fg-peque" x="670.0" y="282" text-anchor="middle">sin memoria: qm start 101</text>
  <path class="fg-flecha" d="M556 290 C 380 350, 140 330, 126 224" stroke-dasharray="5 4"/>
  <path class="fg-flecha" d="M123.2 232.5 L126 224 L130.9 231.5"/>
  <circle class="fg-num" cx="16" cy="120" r="11"/>
  <text class="fg-num-t" x="16" y="124" text-anchor="middle">1</text>
  <circle class="fg-num" cx="296" cy="120" r="11"/>
  <text class="fg-num-t" x="296" y="124" text-anchor="middle">2</text>
  <circle class="fg-num" cx="556" cy="50" r="11"/>
  <text class="fg-num-t" x="556" y="54" text-anchor="middle">3</text>
  <circle class="fg-num" cx="556" cy="200" r="11"/>
  <text class="fg-num-t" x="556" y="204" text-anchor="middle">4</text>
</svg>
