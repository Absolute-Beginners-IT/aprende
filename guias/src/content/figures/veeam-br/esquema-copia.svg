<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" aria-hidden="true">
  <text class="fg-texto fg-negrita" x="20" y="30">Qué viaja y dónde se guarda en una copia de una máquina de Proxmox VE</text>
  <rect class="fg-lateral" x="16" y="52" width="300" height="300" rx="14"/>
  <text class="fg-tenue fg-peque" x="30" y="74">PROXMOX VE</text>
  <rect class="fg-caja" x="36" y="88" width="260" height="82" rx="12"/>
  <text class="fg-texto fg-negrita" x="166.0" y="112" text-anchor="middle">Máquina virtual</text>
  <text class="fg-tenue fg-peque" x="166.0" y="134" text-anchor="middle">sigue funcionando durante la copia</text>
  <text class="fg-tenue fg-peque" x="166.0" y="152" text-anchor="middle">snapshot temporal en QCOW2</text>
  <rect class="fg-caja fg-caja--clave" x="36" y="196" width="260" height="82" rx="12"/>
  <text class="fg-texto fg-negrita" x="166.0" y="220" text-anchor="middle">Worker</text>
  <text class="fg-tenue fg-peque" x="166.0" y="242" text-anchor="middle">VM pequeña que crea Veeam</text>
  <text class="fg-tenue fg-peque" x="166.0" y="260" text-anchor="middle">lee los discos y los envía</text>
  <path class="fg-flecha fg-flecha--datos" d="M166 170 V196"/>
  <rect class="fg-caja" x="380" y="60" width="400" height="106" rx="12"/>
  <text class="fg-texto fg-negrita" x="580.0" y="84" text-anchor="middle">Servidor de copias (Windows Server)</text>
  <text class="fg-tenue fg-peque" x="580.0" y="106" text-anchor="middle">consola de Veeam y servicios</text>
  <text class="fg-tenue fg-peque" x="580.0" y="124" text-anchor="middle">base de datos de configuración VeeamBackup</text>
  <text class="fg-tenue fg-peque" x="580.0" y="142" text-anchor="middle">decide qué se copia, cuándo y dónde</text>
  <rect class="fg-caja fg-caja--clave" x="380" y="196" width="400" height="82" rx="12"/>
  <text class="fg-texto fg-negrita" x="580.0" y="220" text-anchor="middle">Repositorio REPO-LOCAL-01</text>
  <text class="fg-tenue fg-peque" x="580.0" y="242" text-anchor="middle">E:\Backups en el servidor de copias</text>
  <text class="fg-tenue fg-peque" x="580.0" y="260" text-anchor="middle">aquí quedan los puntos de restauración</text>
  <path class="fg-flecha fg-flecha--datos" d="M296 237 H380"/>
  <text class="fg-tenue fg-peque" x="338" y="228" text-anchor="middle">datos</text>
  <path class="fg-flecha" d="M380 120 C 340 120, 330 210, 296 220" stroke-dasharray="5 4"/>
  <text class="fg-tenue fg-peque" x="330" y="150" text-anchor="middle">órdenes</text>
  <rect class="fg-caja" x="380" y="292" width="400" height="60" rx="12"/>
  <text class="fg-texto fg-negrita" x="580.0" y="316" text-anchor="middle">Copia de la configuración (.bco)</text>
  <text class="fg-tenue fg-peque" x="580.0" y="338" text-anchor="middle">VeeamConfigBackup en un repositorio, y otra copia fuera</text>
  <path class="fg-flecha" d="M580 166 V196 M580 278 V292"/>
  <circle class="fg-num" cx="36" cy="88" r="11"/>
  <text class="fg-num-t" x="36" y="92" text-anchor="middle">1</text>
  <circle class="fg-num" cx="36" cy="196" r="11"/>
  <text class="fg-num-t" x="36" y="200" text-anchor="middle">2</text>
  <circle class="fg-num" cx="380" cy="196" r="11"/>
  <text class="fg-num-t" x="380" y="200" text-anchor="middle">3</text>
  <circle class="fg-num" cx="380" cy="292" r="11"/>
  <text class="fg-num-t" x="380" y="296" text-anchor="middle">4</text>
</svg>
