<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" aria-hidden="true">
  <text class="fg-texto fg-negrita" x="20" y="26">Quién puede consultar el NAS por SNMP</text>
  <rect class="fg-caja fg-caja--clave" x="20" y="46" width="280" height="100" rx="12"/>
  <text class="fg-texto fg-negrita" x="160.0" y="70" text-anchor="middle">Servidor de monitorización</text>
  <text class="fg-tenue fg-peque" x="160.0" y="92" text-anchor="middle">192.168.10.40</text>
  <text class="fg-tenue fg-peque" x="160.0" y="110" text-anchor="middle">consulta SNMPv3, nivel authPriv</text>
  <text class="fg-tenue fg-peque" x="160.0" y="128" text-anchor="middle">usuario monitor, SHA y AES</text>
  <rect class="fg-caja" x="20" y="186" width="280" height="82" rx="12"/>
  <text class="fg-texto fg-negrita" x="160.0" y="210" text-anchor="middle">Otro equipo de la red</text>
  <text class="fg-tenue fg-peque" x="160.0" y="232" text-anchor="middle">la misma consulta</text>
  <text class="fg-tenue fg-peque" x="160.0" y="250" text-anchor="middle">no responde</text>
  <rect class="fg-caja fg-caja--clave" x="400" y="46" width="30" height="222" rx="6"/>
  <rect class="fg-caja" x="520" y="46" width="260" height="222" rx="12"/>
  <text class="fg-texto fg-negrita" x="650.0" y="70" text-anchor="middle">NAS Synology</text>
  <text class="fg-tenue fg-peque" x="650.0" y="92" text-anchor="middle">SNMP service activo</text>
  <text class="fg-tenue fg-peque" x="650.0" y="110" text-anchor="middle">solo SNMPv3</text>
  <text class="fg-tenue fg-peque" x="650.0" y="128" text-anchor="middle">escucha en UDP 161</text>
  <path class="fg-flecha fg-flecha--datos" d="M300 96 L518 96 M510 90 L518 96 L510 102"/>
  <text class="fg-tenue fg-peque" x="350" y="88" text-anchor="middle">UDP 161</text>
  <path class="fg-flecha" d="M300 227 H396"/>
  <path class="fg-icono" d="M380 219 l12 12 M392 219 l-12 12"/>
  <text class="fg-tenue fg-peque" x="340" y="219" text-anchor="middle">denegado</text>
  <text class="fg-texto fg-negrita" x="415" y="296" text-anchor="middle">Cortafuegos de DSM (perfil activo)</text>
  <text class="fg-tenue fg-peque" x="415" y="318" text-anchor="middle">permite UDP 161 solo desde 192.168.10.40</text>
  <text class="fg-tenue fg-peque" x="415" y="336" text-anchor="middle">y lo deniega al resto</text>
  <circle class="fg-num" cx="20" cy="46" r="11"/>
  <text class="fg-num-t" x="20" y="50" text-anchor="middle">1</text>
  <circle class="fg-num" cx="415" cy="46" r="11"/>
  <text class="fg-num-t" x="415" y="50" text-anchor="middle">2</text>
  <circle class="fg-num" cx="20" cy="186" r="11"/>
  <text class="fg-num-t" x="20" y="190" text-anchor="middle">3</text>
  <circle class="fg-num" cx="520" cy="46" r="11"/>
  <text class="fg-num-t" x="520" y="50" text-anchor="middle">4</text>
</svg>
