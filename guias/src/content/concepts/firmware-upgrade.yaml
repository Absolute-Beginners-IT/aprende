id: firmware-upgrade
title: Actualizar el firmware
group: setup-access
order: 7
summary: Instala una versión nueva del sistema operativo del equipo, dejando una forma de volver a la anterior.
explanation: >-
  El firmware es el sistema operativo del equipo. Se actualiza para corregir fallos
  de seguridad y errores, o para tener funciones nuevas. Los switches de gama
  profesional guardan dos imágenes: la que está en uso y otra de reserva. Lo seguro
  es instalar la versión nueva en la de reserva, arrancar con ella y conservar la
  anterior intacta para poder volver. Un servidor, en cambio, se actualiza con su
  gestor de paquetes, y la vuelta atrás es arrancar con el núcleo (kernel) anterior.
  En los dos casos, la actualización solo surte efecto del todo al reiniciar.
risks:
  - El equipo se reinicia y todo lo que depende de él se corta durante varios minutos.
  - Un corte de luz o una imagen dañada durante la escritura puede dejar el equipo sin arrancar.
  - Una versión nueva puede cambiar comportamientos o convertir la configuración a un formato que la versión anterior no entiende.
  - Saltar varias versiones de golpe puede no estar soportado; a veces hay que pasar por una versión intermedia.
prerequisites:
  - Leer las notas de la versión nueva y comprobar que la ruta de actualización desde la actual está soportada.
  - Descargar la imagen o los paquetes desde la fuente oficial del fabricante.
  - Tener una copia de la configuración fuera del equipo.
  - Hacerlo en una ventana de mantenimiento, con acceso por consola y alimentación estable.
