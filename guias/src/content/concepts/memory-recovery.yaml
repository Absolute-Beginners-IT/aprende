id: memory-recovery
title: Recuperar un equipo saturado de memoria
group: security-resilience
order: 10
summary: >-
  Devuelve el servicio en pocos minutos cuando el firewall se queda sin memoria y
  deja de aceptar conexiones nuevas, y deja registrado lo que ha pasado para el
  proveedor.
explanation: >-
  Cuando un firewall se queda sin memoria, se protege: mantiene las conexiones que
  ya estaban abiertas y rechaza las nuevas. Por eso parece una caída a medias: una
  videollamada sigue funcionando, pero no carga ninguna web nueva. Si hay dos
  firewalls en clúster, el de reserva no suele tomar el relevo solo. Esta guía te
  lleva por el camino corto: confirmar el problema, guardar las pruebas, pasar el
  servicio al firewall sano y recuperar el saturado. El porqué está explicado al
  final de la guía, en «Para entenderlo mejor».
risks:
  - Pasar el servicio al otro firewall corta unos segundos el tráfico; alguna descarga o llamada en curso se puede caer.
  - Reiniciar un proceso del firewall interrumpe un momento la inspección del tráfico.
  - Reiniciar un firewall antes de guardar las pruebas impide saber qué proceso llenó la memoria.
  - Si la causa es un fallo de la versión, el otro firewall puede acabar igual; avisa siempre al proveedor.
prerequisites:
  - Acceso de administrador al firewall por SSH.
  - Un programa de SSH que guarde la sesión en un archivo, como PuTTY.
  - El contacto del proveedor o del soporte del fabricante.
background:
  - firewall-high-availability
